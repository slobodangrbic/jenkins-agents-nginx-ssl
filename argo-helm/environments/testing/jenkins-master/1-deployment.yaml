apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-master
  namespace: jenkins-testing
  labels:
    app: jenkins-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-testing
  template:
    metadata:
      labels:
        app: jenkins-testing
    spec:
      containers:
        - name: jenkins-testing
          image: slobodang/jenkins-master:latest
          ports:
            - containerPort: 8080
