---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-foo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/slobodangrbic/jenkins-agents-nginx-ssl.git
    targetRevision: HEAD
    path: argo-helm/environments/staging/demo-app-foo
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 
      allowEmpty: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true
    - PruneLast=true
    - PrunePropagationPolicy=Foreground