apiVersion: apps/v1
kind: Deployment
metadata:
  name: postman-master
  namespace: postman-dev
  labels:
    app: postman-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postman-dev
  template:
    metadata:
      labels:
        app: postman-dev
    spec:
      containers:
        - name: postman-dev
          image: slobodang/jenkins-postman-slave:latest
          ports:
            - containerPort: 22
