apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: prod
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: slobodang/nginx:1.23.6
          ports:
            - containerPort: 80
