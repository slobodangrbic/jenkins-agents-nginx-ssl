---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/slobodangrbic/jenkins-agents-nginx-ssl.git
    targetRevision: HEAD
    path: argo-helm/demo-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod